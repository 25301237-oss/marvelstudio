<html lang="es">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">

        <title>TU PELÍCULA FAVORITA | Universo Marvel</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header class="topbar">
            <nav class="nav wrap">
                <a class="logo" href="index.html">
                    <span>MARVEL</span>
                    <b>UNIVERSE</b>
                </a>
                <button class="menu-toggle" aria-label="Abrir menú" aria-expanded="false">☰</button>
                <div class="nav-links">
                    <a class="nav-link " href="index.html">Inicio</a>
                    <a class="nav-link " href="peliculas.html">Películas</a>
                    <a class="nav-link " href="cronologia.html">Cronología</a>
                    <a class="nav-link " href="personajes.html">Personajes</a>
                    <a class="nav-link active" href="favorita.html">Tu favorita</a>
                </div>
            </nav>
        </header>
        <main>
            <section class="page-intro wrap reveal">
                <span class="eyebrow">COMPARTE TU ELECCIÓN</span>
                <h1>TU PELÍCULA FAVORITA</h1>
            </section>
            <section class="wrap section">
                <div class="form-layout">
                    <div class="form-art reveal">
                        <img src="imagen27.jpeg" alt="Spider-Man No Way Home"></div>
                        <form id="formFavorita" class="vote-form reveal">
                            <h2>¡Tu opinión cuenta!</h2>
                            <p>Elige tu película preferida y cuéntanos por qué.</p>
                            <label>Tu nombre<input id="nombre" required minlength="2" maxlength="60" placeholder="Escribe tu nombre"></label>
                            <label>Correo electrónico<input id="correo" type="email" required placeholder="correo@ejemplo.com"></label>
                            <label>Película favorita<select id="pelicula" required>
                                <option value="">Selecciona una película...</option></select>
                            </label>
                            <label>Calificación<select id="calificacion" required>
                                <option value="">Selecciona...</option>
                                <option value="5">★★★★★</option>
                                <option value="4">★★★★</option>
                                <option value="3">★★★</option>
                                <option value="2">★★</option>
                                <option value="1">★</option></select>
                            </label>
                            <label>¿Por qué es tu favorita?<textarea id="razon" minlength="15" maxlength="600" required rows="4" placeholder="Cuéntanos qué te gustó..."></textarea>
                            </label>
                            <label class="check">
                                <input id="acepto" type="checkbox" required> Acepto guardar mi respuesta en este dispositivo.</label>
                                <button class="btn primary" type="submit">Guardar mi favorita ↗</button>
                                <div id="ultimaRespuesta" aria-live="polite"></div>
                            </form>
                        </div>
                    </section>
                </main>
                <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Vista ampliada" hidden>
                    <button class="close-lightbox" aria-label="Cerrar">✕</button>
                    <img alt=""><p></p>
                </div>
                <script src="datos.js">                    
                </script>
                <script src="function.js">                    
                </script>
                </body>
                </html>
